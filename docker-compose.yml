services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: webspl-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webspl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-webspl_db}
    # PostgreSQL NO expuesto al exterior — solo accesible internamente por el servicio app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webspl_user -d webspl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación Web Backend + Frontend (Express + SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webspl-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-webspl_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-webspl_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://slpsoluciones.cloud}
      - APP_URL=${APP_URL:-https://slpsoluciones.cloud}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

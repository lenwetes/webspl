version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: webspl-db
    restart: always
    environment:
      POSTGRES_USER: webspl_user
      POSTGRES_PASSWORD: webspl_pass
      POSTGRES_DB: webspl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webspl_user -d webspl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación Web Backend + Frontend (Express + SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webspl-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://webspl_user:webspl_pass@db:5432/webspl_db
      - JWT_SECRET=slp_jwt_secret_key_2026_prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

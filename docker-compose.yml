version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webspl-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://webspl_user:webspl_secure_pass_2026@db:5432/webspl_db
      - JWT_SECRET=slp_jwt_secret_key_production_2026
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: webspl-postgres
    restart: always
    environment:
      POSTGRES_DB: webspl_db
      POSTGRES_USER: webspl_user
      POSTGRES_PASSWORD: webspl_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webspl_user -d webspl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
